openapi: 3.0.3
info:
  title: EduPro API
  version: 1.0.0
  description: 'API منصة التعليم أونلاين (حصص لايف، كورسات مسجلة، واجبات وامتحانات،
    شات، دفع). كل الطلبات المحمية محتاجة هيدر Authorization: Bearer <access>.'
paths:
  /api/v1/admin/coupons/:
    get:
      operationId: admin_coupons_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: أي حقل يجب استخدامه عند ترتيب النتائج.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: مصطلح البحث.
        schema:
          type: string
      tags:
      - Admin - Payments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCouponList'
          description: ''
    post:
      operationId: admin_coupons_create
      tags:
      - Admin - Payments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CouponRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CouponRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CouponRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coupon'
          description: ''
  /api/v1/admin/coupons/{id}/:
    get:
      operationId: admin_coupons_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: نوع رقم صحيح فريد يحدد هذا coupon.
        required: true
      tags:
      - Admin - Payments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coupon'
          description: ''
    put:
      operationId: admin_coupons_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: نوع رقم صحيح فريد يحدد هذا coupon.
        required: true
      tags:
      - Admin - Payments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CouponRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CouponRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CouponRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coupon'
          description: ''
    patch:
      operationId: admin_coupons_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: نوع رقم صحيح فريد يحدد هذا coupon.
        required: true
      tags:
      - Admin - Payments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCouponRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCouponRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCouponRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coupon'
          description: ''
    delete:
      operationId: admin_coupons_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: نوع رقم صحيح فريد يحدد هذا coupon.
        required: true
      tags:
      - Admin - Payments
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/admin/reports/teacher-hours/:
    get:
      operationId: admin_reports_teacher_hours_retrieve
      description: تقرير ساعات المدرسين في شهر — للمحاسبة.
      summary: تقرير ساعات/حصص المدرسين لشهر (?month=2026-10)
      parameters:
      - in: query
        name: month
        schema:
          type: string
      tags:
      - Admin - Reports
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/admin/users/:
    get:
      operationId: admin_users_list
      summary: كل المستخدمين (?role=teacher&is_active=true&search=)
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: is_phone_verified
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: أي حقل يجب استخدامه عند ترتيب النتائج.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
        schema:
          type: integer
      - in: query
        name: role
        schema:
          type: string
          enum:
          - admin
          - student
          - supervisor
          - teacher
        description: |-
          * `admin` - مدير
          * `supervisor` - مشرف
          * `teacher` - مدرس
          * `student` - طالب
      - name: search
        required: false
        in: query
        description: مصطلح البحث.
        schema:
          type: string
      - in: query
        name: teacher_profile__approval_status
        schema:
          type: string
          enum:
          - approved
          - pending
          - rejected
          - suspended
        description: |-
          * `pending` - قيد المراجعة
          * `approved` - معتمد
          * `rejected` - مرفوض
          * `suspended` - موقوف
      tags:
      - Admin - Users
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminUserList'
          description: ''
    post:
      operationId: admin_users_create
      tags:
      - Admin - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreateUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminCreateUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminCreateUserRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCreateUser'
          description: ''
  /api/v1/admin/users/{id}/:
    get:
      operationId: admin_users_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: نوع رقم صحيح فريد يحدد هذا المستخدم.
        required: true
      tags:
      - Admin - Users
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
    put:
      operationId: admin_users_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: نوع رقم صحيح فريد يحدد هذا المستخدم.
        required: true
      tags:
      - Admin - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminUserRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
    patch:
      operationId: admin_users_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: نوع رقم صحيح فريد يحدد هذا المستخدم.
        required: true
      tags:
      - Admin - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
    delete:
      operationId: admin_users_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: نوع رقم صحيح فريد يحدد هذا المستخدم.
        required: true
      tags:
      - Admin - Users
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/admin/users/{id}/teacher-review/:
    post:
      operationId: admin_users_teacher_review_create
      summary: اعتماد/رفض/إيقاف مدرس + تعيين مشرف
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: نوع رقم صحيح فريد يحدد هذا المستخدم.
        required: true
      tags:
      - Admin - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeacherReviewActionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TeacherReviewActionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TeacherReviewActionRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
  /api/v1/admin/violations/:
    get:
      operationId: admin_violations_list
      summary: (إدارة) محاولات التواصل خارج المنصة ?reviewed=false
      parameters:
      - name: ordering
        required: false
        in: query
        description: أي حقل يجب استخدامه عند ترتيب النتائج.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
        schema:
          type: integer
      - in: query
        name: reviewed
        schema:
          type: boolean
      - name: search
        required: false
        in: query
        description: مصطلح البحث.
        schema:
          type: string
      - in: query
        name: user
        schema:
          type: integer
      tags:
      - Admin - Chat oversight
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedContactViolationList'
          description: ''
  /api/v1/admin/violations/{id}/:
    patch:
      operationId: admin_violations_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: نوع رقم صحيح فريد يحدد هذا contact violation.
        required: true
      tags:
      - Admin - Chat oversight
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedContactViolationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedContactViolationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedContactViolationRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactViolation'
          description: ''
  /api/v1/articles/:
    get:
      operationId: articles_list
      summary: المقالات المنشورة
      parameters:
      - in: query
        name: category
        schema:
          type: integer
      - in: query
        name: category__slug
        schema:
          type: string
      - in: query
        name: is_featured
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: أي حقل يجب استخدامه عند ترتيب النتائج.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: subject
        schema:
          type: integer
      - in: query
        name: tags__slug
        schema:
          type: string
      tags:
      - Blog
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedArticleListList'
          description: ''
  /api/v1/articles/{slug}/:
    get:
      operationId: articles_retrieve
      summary: 'مقال كامل: body فيه ids للعناوين + toc (فهرس) + faq + related'
      parameters:
      - in: path
        name: slug
        schema:
          type: string
          pattern: ^[^/]+$
        required: true
      tags:
      - Blog
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleDetail'
          description: ''
  /api/v1/attempts/:
    get:
      operationId: attempts_list
      summary: 'المحاولات/النتائج (الطالب: بتاعته، المدرس: لطلابه، الإدارة: الكل)'
      parameters:
      - name: ordering
        required: false
        in: query
        description: أي حقل يجب استخدامه عند ترتيب النتائج.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
        schema:
          type: integer
      - in: query
        name: quiz
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: مصطلح البحث.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - graded
          - in_progress
          - submitted
        description: |-
          * `in_progress` - جاري الحل
          * `submitted` - في انتظار التصحيح
          * `graded` - تم التصحيح
      - in: query
        name: student
        schema:
          type: integer
      tags:
      - Quizzes - Student
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAttemptListList'
          description: ''
  /api/v1/attempts/{id}/:
    get:
      operationId: attempts_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: نوع رقم صحيح فريد يحدد هذا attempt.
        required: true
      tags:
      - Quizzes - Student
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attempt'
          description: ''
  /api/v1/attempts/{id}/answer/:
    post:
      operationId: attempts_answer_create
      summary: حفظ إجابة سؤال (ينفع تتبعت أكتر من مرة)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: نوع رقم صحيح فريد يحدد هذا attempt.
        required: true
      tags:
      - Quizzes - Student
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerSubmitRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AnswerSubmitRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AnswerSubmitRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/attempts/{id}/grade/:
    post:
      operationId: attempts_grade_create
      summary: (مدرس) تصحيح الأسئلة المقالية/الملفات
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: نوع رقم صحيح فريد يحدد هذا attempt.
        required: true
      tags:
      - Quizzes - Student
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttemptGradeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AttemptGradeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AttemptGradeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attempt'
          description: ''
  /api/v1/attempts/{id}/submit/:
    post:
      operationId: attempts_submit_create
      summary: تسليم المحاولة والتصحيح التلقائي
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: نوع رقم صحيح فريد يحدد هذا attempt.
        required: true
      tags:
      - Quizzes - Student
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attempt'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      summary: تسجيل الدخول بالموبايل أو الإيميل
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      summary: تسجيل الخروج (إلغاء الـ refresh token)
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/otp/send/:
    post:
      operationId: auth_otp_send_create
      summary: إرسال كود OTP (تأكيد الموبايل / نسيت كلمة السر)
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPSendRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OTPSendRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OTPSendRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/auth/password/change/:
    post:
      operationId: auth_password_change_create
      summary: تغيير كلمة السر
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/auth/password/reset/:
    post:
      operationId: auth_password_reset_create
      summary: تعيين كلمة سر جديدة بالكود
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      summary: تسجيل حساب جديد (طالب/ولي أمر/مدرس)
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
